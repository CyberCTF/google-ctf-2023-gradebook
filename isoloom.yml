# yaml-language-server: $schema=https://www.isoloom.com/schema/v1.json
# Gradebook (Google's 2023 security competition, by Google; a pwn challenge) as an Isoloom spec:
# a school gradebook that maps uploaded binary gradebook files into memory and parses them.
# The challenge folder 2023/quals/pwn-gradebook of Google's challenge archive is vendored unchanged in build/challenge/app/ and built by the overlay Dockerfile next to it.
# `isoloom generate`, then `isoloom run docker`.
version: 1
name: google-ctf-2023-gradebook

# Given by the CyberCTF launcher: this player's flag. Without it the development flag.
inputs:
  CTF_FLAG_MAIN: {}

networks:
  lab: {cidr: 10.60.177.0/24, internet: false}

machines:
  challenge:
    networks: {lab: 10}
    resources: {cpus: 1, memory_mb: 512}
    privileged: true  # the image's setup script mounts /proc and nsjail creates namespaces
    volumes: {ctf: /chroot}     # the flag, written by ctf/flag.sh at every start
    ports:
      challenge:
        port: 1337
        publish: true
    files:
      - path: /run/lab/ctf_flag_main
        input: CTF_FLAG_MAIN
    setup:
      - ctf/flag.sh
    app:
      build: build/challenge

checks:
  - name: the challenge service answers
    tcp: challenge:1337
    wait: 120
  - name: the gradebook greets the player and asks for the password
    script: checks/probe.sh
    wait: 60

message: |
  Gradebook (Google, 2023) answers at `nc localhost {{ machines.challenge.ports.challenge.published }}`.
  The gradebook is a binary file you upload: which of its fields does the parser trust?
